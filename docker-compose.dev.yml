services:
  backend:
    build:
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend:/opt/app

  frontend:
    build:
      dockerfile: Dockerfile.dev
    environment:
      VITE_BACKEND_URL: ${VITE_BACKEND_URL}
    volumes:
      - ./frontend:/opt/app
      - /opt/app/node_modules

  pgweb:
    image: sosedoff/pgweb
    container_name: pgweb-passplz
    restart: always
    ports:
      - '8081:8081'
    environment:
      PGWEB_DATABASE_URL: postgres://postgres:123@postgres-passplz:5432/passplz?sslmode=disable
    networks:
      - passplz-net
    depends_on:
      - database
