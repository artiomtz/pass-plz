services:
  database:
    image: mysql:8.0
    container_name: mysql-passplz
    restart: on-failure
    ports:
      - "3306:3306"
    networks:
      - passplz-net
    environment:
      MYSQL_DATABASE: passplz
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ${DB_DATA_PATH}:/var/lib/mysql

  backend:
    image: backend-passplz:latest
    container_name: backend-passplz
    restart: on-failure
    ports:
      - "8080:8080"
    networks:
      - passplz-net
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - DB_URL=${DB_URL}
        - DB_USERNAME=${DB_USERNAME}
        - DB_PASSWORD=${DB_PASSWORD}
    environment:
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL}
      BACKEND_URL: ${BACKEND_URL}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_KEY: ${EMAIL_KEY}
      EMAIL_BANNER: ${EMAIL_BANNER}
      EMAIL_TOKEN_EXPIRY_MINUTES: ${EMAIL_TOKEN_EXPIRY_MINUTES}
      LOGS_PATH: ${LOGS_PATH}
      LOGS_NUM_KEEP: ${LOGS_NUM_KEEP}
      LOGS_FILE_SIZE_LIMIT: ${LOGS_FILE_SIZE_LIMIT}
      LOGS_ALL_SIZE_LIMIT: ${LOGS_ALL_SIZE_LIMIT}
      AES_ENCRYPTION_KEY: ${AES_ENCRYPTION_KEY}
      JWT_ENCRYPTION_KEY: ${JWT_ENCRYPTION_KEY}
      JWT_EXPIRY_MINUTES: ${JWT_EXPIRY_MINUTES}
      JWT_REFRESH_EXPIRY_MINUTES: ${JWT_REFRESH_EXPIRY_MINUTES}
      USER_PASSWORD_MIN_LENGTH: ${USER_PASSWORD_MIN_LENGTH}
    depends_on:
      - database

networks:
  passplz-net:
