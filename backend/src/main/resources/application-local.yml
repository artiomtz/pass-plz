spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      initialization-fail-timeout: -1
      connectionTimeout: 60000
      maximumPoolSize: 10
      idleTimeout: 0
      maxLifetime: 0
      minimumIdle: 10
  jpa:
    open-in-view: true
    generate-ddl: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true
security:
  jwt:
    encryptionKey: ${JWT_ENCRYPTION_KEY}
    expirationMinutes: ${JWT_ENCRYPTION_KEY_EXPIRY_TIME_MN}
    refreshExpirationMinutes: ${JWT_ENCRYPTION_KEY_REFRESH_TIME_MN}
