application:
  servers:
    frontend: ${FRONTEND_URL}
    backend: ${BACKEND_URL}

spring:
  config:
    activate:
      profile: local
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      initialization-fail-timeout: -1
      connectionTimeout: 60000
      maximumPoolSize: 10
      idleTimeout: 0
      maxLifetime: 0
      minimumIdle: 10
  jpa:
    open-in-view: true
    generate-ddl: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true

security:
  aes:
    encryptionKey: ${AES_ENCRYPTION_KEY}
  jwt:
    encryptionKey: ${JWT_ENCRYPTION_KEY}
    expirationMinutes: ${JWT_EXPIRY_MINUTES}
    refreshExpirationMinutes: ${JWT_REFRESH_EXPIRY_MINUTES}

email:
  banner: ${EMAIL_BANNER}
  api:
    host: ${EMAIL_HOST}
    key: ${EMAIL_KEY}
    tokenExpiryMinutes: ${EMAIL_TOKEN_EXPIRY_MINUTES}
