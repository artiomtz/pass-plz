application:
  admin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
  servers:
    frontend: ${FRONTEND_URL}
    backend: ${BACKEND_URL}

spring:
  profile: prod
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      initialization-fail-timeout: -1
      connectionTimeout: 300000
      maximumPoolSize: 10
      idleTimeout: 600000
      maxLifetime: 1800000
      minimumIdle: 10
  jpa:
    open-in-view: false
    generate-ddl: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: false

security:
  userPasswordMinLength: ${USER_PASSWORD_MIN_LENGTH}
  aes:
    encryptionKey: ${AES_ENCRYPTION_KEY}
  jwt:
    encryptionKey: ${JWT_ENCRYPTION_KEY}
    expirationMinutes: ${JWT_EXPIRY_MINUTES}
    refreshExpirationMinutes: ${JWT_REFRESH_EXPIRY_MINUTES}

email:
  banner: ${EMAIL_BANNER}
  api:
    host: ${EMAIL_HOST}
    key: ${EMAIL_KEY}
    tokenExpiryMinutes: ${EMAIL_TOKEN_EXPIRY_MINUTES}
